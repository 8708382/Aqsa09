<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>AQSA AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1220; color: #eef2ff;
      font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 18px; }
    main { width: min(760px, 100%); background: #121d30; border: 1px solid #293750;
      border-radius: 18px; padding: 22px; box-shadow: 0 18px 55px #0005; }
    h1 { margin: 0 0 4px; } .sub { color: #a9b7ce; margin: 0 0 18px; }
    #chat { min-height: 280px; max-height: 52vh; overflow-y: auto; padding: 12px;
      background: #0b1424; border-radius: 12px; }
    .msg { white-space: pre-wrap; overflow-wrap: anywhere; padding: 11px 13px;
      border-radius: 12px; margin: 8px 0; max-width: 92%; }
    .user { background: #254b83; margin-left: auto; }
    .ai { background: #263247; margin-right: auto; }
    form { display: flex; gap: 9px; margin-top: 14px; }
    textarea { flex: 1; resize: vertical; min-height: 48px; max-height: 150px;
      border: 1px solid #3b4b65; border-radius: 10px; padding: 12px;
      color: #eef2ff; background: #0b1424; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 0 20px; color: white;
      background: #3678d4; font-weight: 700; font: inherit; }
    button:disabled { opacity: .55; } #status { color: #a9b7ce; min-height: 24px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1> AQSA AI </h1>
    <p class="sub">Your AI assistant</p>
    <section id="chat" aria-live="polite">
      <div class="msg ai">Hello! I’m AQSA AI. How can I help you?</div>
    </section>
    <form id="form">
      <textarea id="message" placeholder="Type your message..." required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div id="status" role="status"></div>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");
    const chat = document.querySelector("#chat");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");

    function addMessage(text, who) {
      const item = document.createElement("div");
      item.className = `msg ${who}`;
      item.textContent = text;
      chat.appendChild(item);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      status.textContent = "AQSA AI is replying...";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed.");
        addMessage(data.reply, "ai");
        status.textContent = "";
      } catch (error) {
        addMessage(error.message || "Something went wrong.", "ai");
        status.textContent = "Please check the server configuration.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
